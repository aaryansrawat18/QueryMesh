[project]
name = "querymesh"
version = "0.1.0"
description = "QueryMesh — multi-agent system for SQL and ETL via natural language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "fastapi>=0.115.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "uvicorn>=0.32.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "workers"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
demo = ["faker>=40.36.0", "ipython>=9.16.1"]

[tool.ruff]
extend-exclude = [".venv", "pytest-cache-files-*"]

[tool.ruff.lint]
# Syntax and undefined names. Unused imports in the original tutorial stay as they are.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"agents/*" = ["F401"]
"feed_db.py" = ["F401"]
"tests/test_phase5.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
