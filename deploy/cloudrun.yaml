# Cloud Run service. Image is replaced by CI. Secrets come from Secret Manager
# (secretKeyRef), not from a file in the image. Probes hit the public /health route.
# The run.app URL is served by Google's HTTPS load balancer.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: querymesh
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: ghcr.io/OWNER/querymesh:latest
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: QUERYMESH_ENV
              value: production
            - name: ANALYTICS_PORT
              value: "5432"
            - name: ANALYTICS_USER
              value: querymesh_ro
            - name: ANALYTICS_DATABASE
              value: querymesh
            - name: ANALYTICS_HOST
              valueFrom:
                secretKeyRef:
                  name: querymesh-analytics-host
                  key: latest
            - name: ANALYTICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: querymesh-analytics-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: querymesh-jwt
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: querymesh-redis-url
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
  traffic:
    - latestRevision: true
      percent: 100
