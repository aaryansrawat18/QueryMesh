name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and security tests
        run: pytest -q
      - name: Offline eval
        run: python eval/run_eval.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run behind the managed HTTPS load balancer
        run: |
          gcloud run deploy querymesh \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            --port 8000 \
            --min-instances 1 \
            --allow-unauthenticated \
            --set-env-vars QUERYMESH_ENV=production,ANALYTICS_PORT=5432,ANALYTICS_USER=querymesh_ro,ANALYTICS_DATABASE=querymesh \
            --update-secrets JWT_SECRET=querymesh-jwt:latest,ANALYTICS_PASSWORD=querymesh-analytics-password:latest,ANALYTICS_HOST=querymesh-analytics-host:latest,REDIS_URL=querymesh-redis-url:latest \
            --startup-probe-http-get-path=/health \
            --liveness-probe-http-get-path=/health
